<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SellEasy</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="navbar">
        <span id="brandName">SellEasy</span>

        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" />
            <input type="password" id="loginPassword" placeholder="Password" />
            <button id="loginButton">Log in</button>
            <span id="loginStatus"></span>
        </div>
    </div>
    <div id="followForm">
        <input type="text" id="followCategory" placeholder="Category (optional)" />
        <input type="text" id="followCity" placeholder="City (optional)" />
        <button id="followButton">Follow</button>
        <span id="followStatus"></span>
    </div>

    <main id="listings"></main>
    <div id="orderModal"></div>
    <script src="js/app.js"></script>

</body>

</html>
